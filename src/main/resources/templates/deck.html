<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${deck.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <p><a th:href="@{/}">← Все колоды</a></p>
    <h1 class="deck-title" th:text="${deck.title}">Колода</h1>
    <p class="deck-description" th:if="${deck.description != null}" th:text="${deck.description}">Описание</p>
    <p class="deck-count" th:text="(${#strings.isEmpty(query)} ? 'Карточек: ' : 'Найдено: ') + ${#lists.size(cards)}">Карточек: 0</p>
    <div class="deck-actions">
        <a class="button" th:href="@{/decks/{id}/study(id=${deckId})}">Учить</a>
        <a class="button" th:href="@{/decks/{id}/match(id=${deckId})}">Соедини</a>
        <a class="button" th:href="@{/decks/{id}/cards/new(id=${deckId})}">Добавить карточку</a>
        <a class="button" th:href="@{/decks/{id}/import(id=${deckId})}">Импорт из файла</a>
        <a class="button" th:href="@{/decks/{id}/export(id=${deckId})}">Скачать .csv</a>
        <form class="inline-form" method="post" th:action="@{/decks/{id}/delete(id=${deckId})}"
              data-confirm="Удалить колоду вместе со всеми карточками?">
            <button class="button button-danger" type="submit">Удалить колоду</button>
        </form>
    </div>
    <form class="search-form" method="get" th:action="@{/decks/{id}(id=${deckId})}">
        <input type="search" name="q" th:value="${query}" th:maxlength="${searchMaxLength}"
               placeholder="Найти карточку" aria-label="Поиск карточек">
        <button class="button" type="submit">Найти</button>
        <a th:if="${query != null and !#strings.isEmpty(query)}" th:href="@{/decks/{id}(id=${deckId})}">Сбросить</a>
    </form>
    <p class="empty" th:if="${#lists.isEmpty(cards) and #strings.isEmpty(query)}">В этой колоде пока нет карточек.</p>
    <p class="empty" th:if="${#lists.isEmpty(cards) and !#strings.isEmpty(query)}">По запросу ничего не найдено.</p>
    <table class="card-table" th:unless="${#lists.isEmpty(cards)}">
        <thead>
        <tr>
            <th>Термин</th>
            <th>Определение</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="card : ${cards}">
            <td th:text="${card.term}">Термин</td>
            <td th:text="${card.definition}">Определение</td>
            <td class="row-actions">
                <a th:href="@{/decks/{deckId}/cards/{cardId}/edit(deckId=${deckId},cardId=${card.id})}">Изменить</a>
                <form class="inline-form" method="post"
                      th:action="@{/decks/{deckId}/cards/{cardId}/delete(deckId=${deckId},cardId=${card.id})}"
                      data-confirm="Удалить эту карточку?">
                    <button class="link-button" type="submit">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
