<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Мои колоды')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1>Мои колоды</h1>
    <p class="empty" th:if="${#lists.isEmpty(decks)}">Колод пока нет.</p>
    <ul class="deck-list" th:unless="${#lists.isEmpty(decks)}">
        <li class="deck-card" th:each="deck : ${decks}">
            <h2 th:text="${deck.title}">Название</h2>
            <p class="deck-description" th:if="${deck.description != null}" th:text="${deck.description}">Описание</p>
            <p class="deck-count" th:text="'Карточек: ' + ${deck.cardCount}">Карточек: 0</p>
        </li>
    </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
